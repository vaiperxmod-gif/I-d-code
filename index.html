<style>

/* =====================================================
   RESET
===================================================== */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}


/* =====================================================
   HTML / BODY
===================================================== */

html,
body {

    width: 100%;
    height: 100%;

    min-height: 100%;

    overflow: hidden;

}


body {

    font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(255,0,60,.14),
            transparent 38%
        ),

        radial-gradient(
            circle at 0% 100%,
            rgba(255,0,60,.08),
            transparent 35%
        ),

        #030305;

    color: #fff;

    position: relative;

    min-height: 100dvh;

    padding: 0 !important;

}


/* =====================================================
   CYBER GRID
===================================================== */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(255,255,255,.022) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.022) 1px,
            transparent 1px
        );

    background-size:
        32px 32px;

    mask-image:

        linear-gradient(
            to bottom,
            transparent,
            #000 18%,
            #000 82%,
            transparent
        );

    pointer-events: none;

    animation:
        gridMove 18s linear infinite;

}


@keyframes gridMove {

    from {

        transform:
            translateY(0);

    }

    to {

        transform:
            translateY(32px);

    }

}


/* =====================================================
   AMBIENT RED GLOW
===================================================== */

body::after {

    content: "";

    position: fixed;

    width: 320px;
    height: 320px;

    border-radius: 50%;

    background: #ff003c;

    filter: blur(150px);

    opacity: .11;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    animation:
        ambientPulse 4s ease-in-out infinite;

}


@keyframes ambientPulse {

    0%,
    100% {

        opacity: .07;

        transform:
            translate(-50%, -50%)
            scale(.9);

    }

    50% {

        opacity: .15;

        transform:
            translate(-50%, -50%)
            scale(1.1);

    }

}


/* =====================================================
   PARTICLES
===================================================== */

.particles {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 0;

}


.particles span {

    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: #ff174d;

    box-shadow:
        0 0 8px #ff174d;

    opacity: .5;

    animation:
        particleFloat linear infinite;

}


.particles span:nth-child(1) {

    left: 10%;
    top: 80%;

    animation-duration: 8s;

}


.particles span:nth-child(2) {

    left: 25%;
    top: 60%;

    animation-duration: 11s;

}


.particles span:nth-child(3) {

    left: 42%;
    top: 90%;

    animation-duration: 7s;

}


.particles span:nth-child(4) {

    left: 67%;
    top: 70%;

    animation-duration: 10s;

}


.particles span:nth-child(5) {

    left: 83%;
    top: 85%;

    animation-duration: 9s;

}


.particles span:nth-child(6) {

    left: 92%;
    top: 40%;

    animation-duration: 12s;

}


@keyframes particleFloat {

    0% {

        transform:
            translateY(0)
            scale(.5);

        opacity: 0;

    }

    20% {

        opacity: .7;

    }

    80% {

        opacity: .5;

    }

    100% {

        transform:
            translateY(-100vh)
            scale(1.5);

        opacity: 0;

    }

}


/* =====================================================
   FULL SCREEN WRAPPER
===================================================== */

.panel-wrap {

    width: 100%;

    height: 100dvh;

    min-height: 100dvh;

    position: relative;

    z-index: 2;

    animation:
        panelIn .7s cubic-bezier(.2,.8,.2,1);

}


@keyframes panelIn {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(.98);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   OUTER FRAME
===================================================== */

.panel-glow {

    display: none;

}


/* =====================================================
   FULL SCREEN PANEL
===================================================== */

.panel {

    width: 100%;

    height: 100dvh;

    min-height: 100dvh;

    padding:

        max(
            28px,
            env(safe-area-inset-top)
        )

        18px

        max(
            20px,
            env(safe-area-inset-bottom)
        );

    border-radius: 0;

    background:

        linear-gradient(
            145deg,
            rgba(15,15,19,.97),
            rgba(3,3,6,.99)
        );

    border: none;

    position: relative;

    overflow: hidden;

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

}


/* =====================================================
   TOP NEON LINE
===================================================== */

.panel::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;

    height: 2px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #ff003c 20%,
            #ff174d 50%,
            #ff003c 80%,
            transparent
        );

    box-shadow:

        0 0 8px #ff174d,

        0 0 20px
        rgba(255,0,55,.7);

}


/* =====================================================
   CORNER GLOW
===================================================== */

.panel::after {

    content: "";

    position: absolute;

    width: 200px;
    height: 200px;

    right: -120px;
    top: -100px;

    border-radius: 50%;

    background:
        rgba(255,0,55,.08);

    filter:
        blur(30px);

    pointer-events: none;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    width: 100%;

    max-width: 480px;

    margin:
        0 auto;

    text-align: center;

    position: relative;

    z-index: 2;

}


/* =====================================================
   STATUS
===================================================== */

.status {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    padding:
        5px 11px;

    margin-bottom: 10px;

    border-radius: 30px;

    background:
        rgba(255,0,55,.07);

    border:
        1px solid
        rgba(255,0,55,.20);

    color:
        rgba(255,255,255,.55);

    font-size: 8px;

    font-weight: 800;

    letter-spacing: 2px;

}


.status-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #ff174d;

    box-shadow:

        0 0 6px #ff174d,

        0 0 12px #ff174d;

    animation:
        statusPulse 1.5s infinite;

}


@keyframes statusPulse {

    0%,
    100% {

        opacity: .45;

        transform:
            scale(.8);

    }

    50% {

        opacity: 1;

        transform:
            scale(1.2);

    }

}


/* =====================================================
   BRAND
===================================================== */

.brand {

    font-size: 31px;

    font-weight: 950;

    letter-spacing: 1px;

    line-height: 1.15;

    color: #fff;

    text-shadow:

        0 0 7px
        rgba(255,0,55,.9),

        0 0 18px
        rgba(255,0,55,.65),

        0 0 38px
        rgba(255,0,55,.35);

    display: inline-block;

}


.brand span {

    color: #ff174d;

    text-shadow:

        0 0 8px #ff174d,

        0 0 18px #ff174d,

        0 0 32px
        rgba(255,23,77,.8);

}


/* =====================================================
   BRAND LINE
===================================================== */

.brand-line {

    width: 55px;

    height: 2px;

    margin:
        9px auto 0;

    background: #ff174d;

    border-radius: 5px;

    box-shadow:

        0 0 7px #ff174d,

        0 0 15px #ff174d;

    animation:
        linePulse 2s ease-in-out infinite;

}


@keyframes linePulse {

    0%,
    100% {

        width: 35px;

        opacity: .5;

    }

    50% {

        width: 75px;

        opacity: 1;

    }

}


/* =====================================================
   SUBTITLE
===================================================== */

.subtitle {

    margin-top: 9px;

    font-size: 9px;

    font-weight: 800;

    letter-spacing: 3.5px;

    color:
        rgba(255,255,255,.38);

}


/* =====================================================
   SEPARATOR
===================================================== */

.separator {

    width: 100%;

    max-width: 480px;

    height: 1px;

    margin:
        23px auto 18px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,23,77,.9),
            transparent
        );

    box-shadow:
        0 0 12px
        rgba(255,0,55,.55);

    position: relative;

}


.separator::after {

    content: "◆";

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    color: #ff174d;

    font-size: 7px;

    text-shadow:
        0 0 8px #ff174d;

    background: #08080b;

    padding:
        0 7px;

}


/* =====================================================
   BUTTON LIST
===================================================== */

.button-list {

    width: 100%;

    max-width: 480px;

    margin:
        0 auto;

    display: flex;

    flex-direction: column;

    gap: 13px;

}


/* =====================================================
   ACTION BUTTON
===================================================== */

.action-button {

    width: 100%;

    min-height: 72px;

    display: flex;

    align-items: center;

    padding:
        0 13px 0 14px;

    border-radius: 17px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.018)
        );

    color: #fff;

    cursor: pointer;

    overflow: hidden;

    position: relative;

    text-align: left;

    transition:

        transform .18s ease,

        border-color .18s ease,

        box-shadow .18s ease,

        background .18s ease;

    box-shadow:

        0 8px 22px
        rgba(0,0,0,.30);

}


/* =====================================================
   TOP LINE
===================================================== */

.action-button .top-line {

    position: absolute;

    top: 0;

    left: 18px;
    right: 18px;

    height: 1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,23,77,.45),
            transparent
        );

}


/* =====================================================
   LEFT RED BAR
===================================================== */

.action-button::before {

    content: "";

    position: absolute;

    left: 0;

    top: 12px;

    width: 3px;

    height: 44px;

    border-radius:
        0 5px 5px 0;

    background:

        linear-gradient(
            to bottom,
            #ff003c,
            #ff174d,
            #ff003c
        );

    box-shadow:

        0 0 8px #ff174d,

        0 0 18px
        rgba(255,23,77,.8);

}


/* =====================================================
   MOVING LIGHT
===================================================== */

.action-button::after {

    content: "";

    position: absolute;

    top: -20%;

    left: -120%;

    width: 70%;

    height: 140%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,0,55,.15),
            rgba(255,255,255,.07),
            transparent
        );

    transform:
        skewX(-20deg);

    transition:
        left .65s ease;

    pointer-events: none;

}


.action-button:hover::after {

    left: 140%;

}


/* =====================================================
   ICON
===================================================== */

.icon-box {

    width: 44px;
    height: 44px;

    min-width: 44px;

    margin-right: 13px;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 13px;

    background:

        linear-gradient(
            145deg,
            #ff174d,
            #c90035
        );

    color: #fff;

    position: relative;

    z-index: 2;

    box-shadow:

        0 0 12px
        rgba(255,0,55,.35),

        0 5px 12px
        rgba(0,0,0,.35),

        inset 0 1px 0
        rgba(255,255,255,.22);

    transition:
        transform .18s ease;

}


.icon-box svg {

    width: 21px;
    height: 21px;

    fill: currentColor;

    filter:
        drop-shadow(
            0 2px 3px
            rgba(0,0,0,.35)
        );

}


/* =====================================================
   TEXT
===================================================== */

.text-area {

    flex: 1;

    min-width: 0;

    position: relative;

    z-index: 2;

}


.title {

    font-size: 14px;

    font-weight: 850;

    line-height: 1.35;

    color: #fff;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


.description {

    margin-top: 4px;

    font-size: 9px;

    line-height: 1.4;

    color:
        rgba(255,255,255,.38);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =====================================================
   ARROW
===================================================== */

.arrow {

    width: 29px;
    height: 29px;

    min-width: 29px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        rgba(255,0,55,.08);

    border:
        1px solid
        rgba(255,23,77,.15);

    color: #ff174d;

    font-size: 21px;

    font-weight: 900;

    position: relative;

    z-index: 2;

    transition:
        transform .2s ease,
        background .2s ease;

    text-shadow:
        0 0 9px #ff174d;

}


/* =====================================================
   HOVER
===================================================== */

.action-button:hover {

    transform:
        translateY(-2px);

    border-color:
        rgba(255,23,77,.42);

    background:

        linear-gradient(
            135deg,
            rgba(255,0,55,.10),
            rgba(255,255,255,.025)
        );

    box-shadow:

        0 12px 30px
        rgba(0,0,0,.42),

        0 0 22px
        rgba(255,0,55,.10);

}


.action-button:hover .icon-box {

    transform:
        scale(1.06);

}


.action-button:hover .arrow {

    transform:
        translateX(4px);

    background:
        rgba(255,0,55,.18);

}


/* =====================================================
   ACTIVE
===================================================== */

.action-button:active {

    transform:
        scale(.965);

    border-color:
        #ff174d;

    box-shadow:

        0 0 28px
        rgba(255,0,55,.25),

        inset 0 0 22px
        rgba(255,0,55,.08);

}


.action-button:active .arrow {

    transform:
        translateX(5px);

}


/* =====================================================
   RIPPLE
===================================================== */

.ripple {

    position: absolute;

    border-radius: 50%;

    background:
        rgba(255,255,255,.18);

    transform:
        scale(0);

    animation:
        ripple .55s linear;

    pointer-events: none;

    z-index: 10;

}


@keyframes ripple {

    to {

        transform:
            scale(4);

        opacity: 0;

    }

}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    width: 100%;

    max-width: 480px;

    margin:
        16px auto 0;

    text-align: center;

    font-size: 8px;

    font-weight: 700;

    letter-spacing: 2.5px;

    color:
        rgba(255,255,255,.20);

    position: relative;

    z-index: 2;

}


.footer span {

    color:
        rgba(255,23,77,.65);

}


/* =====================================================
   TALL SCREEN
===================================================== */

@media (min-height: 750px) {

    .panel {

        padding-top:
            max(
                45px,
                env(safe-area-inset-top)
            );

    }

    .separator {

        margin-top: 26px;

        margin-bottom: 21px;

    }

    .button-list {

        gap: 14px;

    }

    .action-button {

        min-height: 76px;

    }

}


/* =====================================================
   SMALL SCREEN
===================================================== */

@media (max-height: 700px) {

    .panel {

        padding-top:
            max(
                20px,
                env(safe-area-inset-top)
            );

    }

    .separator {

        margin-top: 17px;

        margin-bottom: 13px;

    }

    .button-list {

        gap: 9px;

    }

    .action-button {

        min-height: 61px;

    }

    .icon-box {

        width: 39px;
        height: 39px;

        min-width: 39px;

    }

}


/* =====================================================
   VERY SMALL WIDTH
===================================================== */

@media (max-width: 380px) {

    .panel {

        padding-left: 14px;

        padding-right: 14px;

    }

    .brand {

        font-size: 27px;

    }

    .subtitle {

        font-size: 8px;

        letter-spacing: 2.7px;

    }

    .action-button {

        border-radius: 15px;

    }

    .title {

        font-size: 13px;

    }

    .description {

        font-size: 8px;

    }

}


/* =====================================================
   REDUCE MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration: .01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: .01ms !important;

    }

}

</style>

</head>

<script>

/* =====================================================
   OPEN LINK
===================================================== */

function openLink(
    url,
    event,
    button
) {


    /* CREATE RIPPLE */

    createRipple(
        event,
        button
    );


    /* NO LINK */

    if (!url) {

        return;

    }


    /* OPEN LINK */

    setTimeout(() => {

        window.open(
            url,
            "_blank"
        );

    }, 180);

}


/* =====================================================
   RIPPLE EFFECT
===================================================== */

function createRipple(
    event,
    button
) {

    if (
        !event ||
        !button
    ) {

        return;

    }


    const rect =
        button.getBoundingClientRect();


    const ripple =
        document.createElement(
            "span"
        );


    ripple.classList.add(
        "ripple"
    );


    const size =
        Math.max(
            rect.width,
            rect.height
        );


    ripple.style.width =
        size + "px";


    ripple.style.height =
        size + "px";


    ripple.style.left =
        (
            event.clientX -
            rect.left -
            size / 2
        ) + "px";


    ripple.style.top =
        (
            event.clientY -
            rect.top -
            size / 2
        ) + "px";


    button.appendChild(
        ripple
    );


    setTimeout(() => {

        ripple.remove();

    }, 600);

}


/* =====================================================
   DISABLE CONTEXT MENU
===================================================== */

document.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    }
);


/* =====================================================
   PREVENT DOUBLE TAP ZOOM
===================================================== */

let lastTouchEnd = 0;


document.addEventListener(
    "touchend",
    function(event) {

        const now =
            Date.now();


        if (
            now - lastTouchEnd <= 300
        ) {

            event.preventDefault();

        }


        lastTouchEnd = now;

    },
    {
        passive: false
    }
);

</script>
