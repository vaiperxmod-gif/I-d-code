<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070707">
<title>VAIPERX IOS</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100dvh;
    overflow-x: hidden;
    font-family: 'Kanit', sans-serif;
    color: #fff;
    background:
        radial-gradient(circle at 50% -10%, rgba(255, 0, 55, .16), transparent 34%),
        linear-gradient(145deg, #030303 0%, #0b0b0d 52%, #030303 100%);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(to bottom, black, transparent 85%);
}

.vx-page {
    width: 100%;
    min-height: 100dvh;
    padding: 22px 14px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.vx-header {
    text-align: center;
    margin-bottom: 20px;
}

.vx-brand {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(30px, 9vw, 58px);
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 1;
    font-style: italic;
    color: #fff;
    text-shadow:
        0 0 4px rgba(255,255,255,.8),
        0 0 18px rgba(255,0,50,.7),
        0 0 40px rgba(255,0,50,.35);
}

.vx-brand span {
    color: #ff1748;
}

.vx-sub {
    margin-top: 9px;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(9px, 2.8vw, 13px);
    letter-spacing: 3px;
    color: #bdbdbd;
}

.vx-line {
    width: min(330px, 80%);
    height: 1px;
    margin: 14px auto 0;
    background: linear-gradient(90deg, transparent, #ff1748, #fff, #ff1748, transparent);
    box-shadow: 0 0 12px rgba(255, 0, 50, .7);
}

.vx-menu {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.vx-card {
    position: relative;
    width: 100%;
    min-height: 100px;
    display: flex;
    align-items: center;
    text-decoration: none;
    color: #fff;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.13);
    border-left: 3px solid #ff1748;
    border-radius: 18px;
    background: linear-gradient(110deg, rgba(255,255,255,.065), rgba(255,255,255,.025));
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 10px 35px rgba(0,0,0,.45),
        0 0 0 1px rgba(255,0,50,.035);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}

.vx-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 45%;
    height: 1px;
    background: linear-gradient(90deg, #ff1748, transparent);
}

.vx-card::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;
    width: 35%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,23,72,.7));
}

.vx-card:active {
    transform: scale(.975);
}

.vx-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255,23,72,.65);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.1),
        0 12px 40px rgba(0,0,0,.55),
        0 0 24px rgba(255,0,50,.12);
}

.vx-icon {
    width: 65px;
    min-width: 65px;
    height: 65px;
    margin: 0 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,23,72,.55);
    border-radius: 15px;
    background: rgba(255,23,72,.08);
    color: #fff;
    font-size: 28px;
    box-shadow:
        inset 0 0 18px rgba(255,23,72,.08),
        0 0 16px rgba(255,23,72,.08);
}

.vx-content {
    min-width: 0;
    flex: 1;
    padding: 2px 0;
}

.vx-title {
    font-size: clamp(17px, 5vw, 25px);
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: .2px;
}

.vx-desc {
    margin-top: 5px;
    color: #aaa;
    font-size: clamp(10px, 3vw, 14px);
    font-weight: 300;
}

.vx-arrow {
    width: 45px;
    min-width: 45px;
    height: 45px;
    margin-right: 13px;
    border: 1px solid rgba(255,23,72,.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ff1748;
    font-family: Arial, sans-serif;
    font-size: 35px;
    line-height: 1;
    background: rgba(255,23,72,.055);
    text-shadow: 0 0 10px #ff1748;
}

.vx-footer {
    margin-top: 18px;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    letter-spacing: 3px;
    color: #666;
}

.vx-footer span {
    color: #ff1748;
}

@media (max-width: 430px) {
    .vx-page {
        min-height: 100dvh;
        padding: 17px 9px 14px;
        justify-content: center;
    }

    .vx-header {
        margin-bottom: 15px;
    }

    .vx-menu {
        gap: 10px;
    }

    .vx-card {
        min-height: 91px;
        border-radius: 15px;
    }

    .vx-icon {
        width: 56px;
        min-width: 56px;
        height: 56px;
        margin-left: 10px;
        margin-right: 11px;
        border-radius: 13px;
        font-size: 24px;
    }

    .vx-arrow {
        width: 39px;
        min-width: 39px;
        height: 39px;
        margin-right: 9px;
        font-size: 30px;
    }

    .vx-desc {
        margin-top: 3px;
    }
}

@media (max-width: 360px) {
    .vx-brand {
        font-size: 28px;
    }

    .vx-card {
        min-height: 84px;
    }

    .vx-icon {
        width: 50px;
        min-width: 50px;
        height: 50px;
        margin-left: 8px;
        margin-right: 9px;
    }

    .vx-title {
        font-size: 15px;
    }

    .vx-desc {
        font-size: 9px;
    }

    .vx-arrow {
        width: 35px;
        min-width: 35px;
        height: 35px;
        margin-right: 7px;
        font-size: 27px;
    }
}

/* VAIPERX BACKGROUND IMAGE */
body {
    background:
        linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.18)),
        url("https://img2.pic.in.th/ChatGPT-Image-11-..-2569-10_41_06fc9beab9f6ce425d.png") center center / cover no-repeat fixed;
}

body::before {
    display: none;
}

@media (max-width: 430px) {
    body {
        background-position: center center;
        background-size: cover;
        background-attachment: fixed;
    }
}


/* =========================================================
   3D ICON BUTTONS
   ไอคอนทำด้วย SVG ภายในไฟล์ ไม่พึ่งรูปจาก URL
   ========================================================= */

.vx-icon {
    position: relative;
    overflow: hidden;
    color: #fff;
    background:
        linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,23,72,.10) 45%, rgba(0,0,0,.42));
    border: 1px solid rgba(255,255,255,.30);
    box-shadow:
        inset 2px 2px 5px rgba(255,255,255,.14),
        inset -4px -5px 8px rgba(0,0,0,.48),
        0 5px 0 rgba(100,0,20,.65),
        0 9px 18px rgba(0,0,0,.55),
        0 0 18px rgba(255,23,72,.18);
    transform: translateY(-1px);
}

.vx-icon::before {
    content: "";
    position: absolute;
    width: 70%;
    height: 35%;
    top: 7%;
    left: 12%;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.30), transparent);
    filter: blur(2px);
    pointer-events: none;
}

.vx-icon svg {
    width: 58%;
    height: 58%;
    fill: none;
    stroke: #fff;
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter:
        drop-shadow(2px 3px 0 rgba(70,0,15,.85))
        drop-shadow(0 0 7px rgba(255,23,72,.95));
    position: relative;
    z-index: 2;
}

.vx-card:hover .vx-icon {
    transform: translateY(-3px) rotateX(5deg);
    box-shadow:
        inset 2px 2px 6px rgba(255,255,255,.18),
        inset -4px -5px 8px rgba(0,0,0,.48),
        0 6px 0 rgba(100,0,20,.65),
        0 12px 24px rgba(0,0,0,.6),
        0 0 25px rgba(255,23,72,.30);
}

.vx-card:active .vx-icon {
    transform: translateY(3px);
    box-shadow:
        inset 2px 2px 5px rgba(255,255,255,.10),
        inset -3px -3px 7px rgba(0,0,0,.50),
        0 2px 0 rgba(100,0,20,.65),
        0 4px 10px rgba(0,0,0,.5);
}

.vx-arrow {
    position: relative;
    background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,23,72,.10));
    border-color: rgba(255,255,255,.22);
    box-shadow:
        inset 2px 2px 5px rgba(255,255,255,.12),
        inset -3px -3px 6px rgba(0,0,0,.45),
        0 3px 0 rgba(100,0,20,.65),
        0 6px 12px rgba(0,0,0,.4),
        0 0 13px rgba(255,23,72,.18);
}

.vx-arrow::after {
    content: "";
    position: absolute;
    width: 45%;
    height: 25%;
    top: 12%;
    left: 27%;
    border-radius: 50%;
    background: rgba(255,255,255,.18);
    filter: blur(2px);
}

@media (max-width: 430px) {
    .vx-icon {
        box-shadow:
            inset 2px 2px 5px rgba(255,255,255,.14),
            inset -4px -5px 8px rgba(0,0,0,.48),
            0 4px 0 rgba(100,0,20,.65),
            0 7px 15px rgba(0,0,0,.5),
            0 0 15px rgba(255,23,72,.16);
    }
}

</style>
</head>

<script>
document.querySelectorAll('.vx-card').forEach(card => {
    card.addEventListener('touchstart', () => {
        card.style.transform = 'scale(.975)';
    }, {passive:true});

    const reset = () => {
        card.style.transform = '';
    };

    card.addEventListener('touchend', reset, {passive:true});
    card.addEventListener('touchcancel', reset, {passive:true});
});
</script>
