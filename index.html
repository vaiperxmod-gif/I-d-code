/* =====================================================
   RESET
===================================================== */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}


html,
body {

    width: 100%;

    height: 100%;

    overflow: hidden;

}


body {

    font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

    background: #050505;

    color: #ffffff;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

}


/* =====================================================
   BACKGROUND GRID
===================================================== */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    background:

        linear-gradient(
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        );

    background-size: 35px 35px;

    pointer-events: none;

}


/* =====================================================
   RED GLOW
===================================================== */

body::after {

    content: "";

    position: fixed;

    width: 350px;

    height: 350px;

    background: #ff003c;

    filter: blur(160px);

    opacity: 0.12;

    pointer-events: none;

}


/* =====================================================
   MAIN PANEL
===================================================== */

.panel {

    width: min(92%, 440px);

    padding: 26px 20px 22px;

    position: relative;

    z-index: 2;

    border-radius: 24px;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,0.075),
            rgba(255,255,255,0.015)
        );

    border:
        1px solid rgba(255,0,55,0.35);

    backdrop-filter: blur(22px);

    -webkit-backdrop-filter: blur(22px);

    box-shadow:

        0 0 45px rgba(0,0,0,0.70),

        0 0 35px rgba(255,0,55,0.10),

        inset 0 0 30px rgba(255,255,255,0.015);

}


/* =====================================================
   BRAND
===================================================== */

.brand {

    text-align: center;

    font-size: 29px;

    font-weight: 900;

    letter-spacing: 1px;

    color: #ffffff;

    text-shadow:

        0 0 8px rgba(255,0,55,0.9),

        0 0 18px rgba(255,0,55,0.7),

        0 0 35px rgba(255,0,55,0.45);

}


.brand span {

    color: #ff174d;

    text-shadow:

        0 0 8px #ff174d,

        0 0 18px #ff174d,

        0 0 30px rgba(255,23,77,0.8);

}


/* =====================================================
   SUBTITLE
===================================================== */

.subtitle {

    text-align: center;

    margin-top: 7px;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 3px;

    color: rgba(255,255,255,0.42);

}


/* =====================================================
   SEPARATOR
===================================================== */

.separator {

    width: 100%;

    height: 1px;

    margin: 21px 0;

    background:

        linear-gradient(
            90deg,
            transparent,
            #ff174d,
            transparent
        );

    box-shadow:

        0 0 12px rgba(255,0,55,0.65);

}


/* =====================================================
   BUTTON LIST
===================================================== */

.button-list {

    display: flex;

    flex-direction: column;

    gap: 13px;

}


/* =====================================================
   ACTION BUTTON
===================================================== */

.action-button {

    position: relative;

    width: 100%;

    min-height: 70px;

    display: flex;

    align-items: center;

    padding: 0 16px;

    border-radius: 15px;

    border:
        1px solid rgba(255,0,55,0.30);

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,0.065),
            rgba(255,255,255,0.012)
        );

    color: #ffffff;

    cursor: pointer;

    overflow: hidden;

    transition:

        transform .20s ease,

        border-color .20s ease,

        box-shadow .20s ease,

        background .20s ease;

    box-shadow:

        0 7px 20px rgba(0,0,0,0.35);

}


/* =====================================================
   LEFT RED BAR
===================================================== */

.action-button::before {

    content: "";

    position: absolute;

    left: 0;

    top: 14px;

    width: 3px;

    height: 42px;

    background: #ff174d;

    border-radius:
        0 5px 5px 0;

    box-shadow:

        0 0 8px #ff174d,

        0 0 18px #ff174d;

}


/* =====================================================
   MOVING LIGHT
===================================================== */

.action-button::after {

    content: "";

    position: absolute;

    top: 0;

    left: -130%;

    width: 90%;

    height: 100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,0,55,0.16),
            transparent
        );

    transform:
        skewX(-20deg);

    transition: .6s ease;

}


.action-button:hover::after {

    left: 130%;

}


/* =====================================================
   FILLED ICON BOX
===================================================== */

.icon-box {

    width: 45px;

    height: 45px;

    min-width: 45px;

    display: flex;

    justify-content: center;

    align-items: center;

    margin-right: 14px;

    border-radius: 12px;

    background: #ff174d;

    color: #ffffff;

    box-shadow:

        0 0 10px rgba(255,0,55,0.35),

        0 0 20px rgba(255,0,55,0.12),

        inset 0 -5px 10px rgba(0,0,0,0.18);

    position: relative;

    z-index: 2;

}


/* =====================================================
   SVG FILLED ICON
===================================================== */

.icon-box svg {

    width: 23px;

    height: 23px;

    fill: currentColor;

    filter:

        drop-shadow(
            0 2px 3px rgba(0,0,0,0.35)
        );

}


/* =====================================================
   TEXT AREA
===================================================== */

.text-area {

    flex: 1;

    text-align: left;

    position: relative;

    z-index: 2;

}


.title {

    font-size: 15px;

    font-weight: 800;

    line-height: 1.3;

    color: #ffffff;

}


.description {

    margin-top: 4px;

    font-size: 10px;

    color:
        rgba(255,255,255,0.42);

}


/* =====================================================
   ARROW
===================================================== */

.arrow {

    width: 28px;

    height: 28px;

    display: flex;

    justify-content: center;

    align-items: center;

    border-radius: 50%;

    background:
        rgba(255,0,55,0.10);

    color: #ff174d;

    font-size: 22px;

    font-weight: 900;

    position: relative;

    z-index: 2;

    transition: .20s ease;

    text-shadow:

        0 0 10px rgba(255,0,55,0.7);

}


/* =====================================================
   PRESS EFFECT
===================================================== */

.action-button:active {

    transform: scale(0.96);

    border-color: #ff174d;

    background:

        linear-gradient(
            135deg,
            rgba(255,0,55,0.18),
            rgba(255,255,255,0.025)
        );

    box-shadow:

        0 0 25px rgba(255,0,55,0.25),

        inset 0 0 20px rgba(255,0,55,0.08);

}


.action-button:active .arrow {

    transform:
        translateX(4px);

}


/* =====================================================
   RIPPLE
===================================================== */

.ripple {

    position: absolute;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.20);

    transform: scale(0);

    animation:
        ripple .55s linear;

    pointer-events: none;

    z-index: 5;

}


@keyframes ripple {

    to {

        transform:
            scale(4);

        opacity: 0;

    }

}


/* =====================================================
   FOOTER
===================================================== */

.footer {

        rgba(255,255,255,0.23);

/* =====================================================

<script>

/* =====================================================
   OPEN LINK
===================================================== */

function openLink(url, button) {

    const e = window.event;

    createRipple(e, button);


    /* ถ้ายังไม่มีลิงก์ */

    if (!url) {

        return;

    }


    /* เปิดลิงก์ */

    setTimeout(() => {

        window.open(
            url,
            "_blank"
        );

    }, 180);

}


/* =====================================================
   RIPPLE EFFECT
===================================================== */

function createRipple(e, button) {

    if (!e) return;


    const rect =
        button.getBoundingClientRect();


    const ripple =
        document.createElement("span");


    ripple.classList.add("ripple");


    const size =
        Math.max(
            rect.width,
            rect.height
        );


    ripple.style.width =
        size + "px";


    ripple.style.height =
        size + "px";


    ripple.style.left =
        (
            e.clientX -
            rect.left -
            size / 2
        ) + "px";


    ripple.style.top =
        (
            e.clientY -
            rect.top -
            size / 2
        ) + "px";


    button.appendChild(ripple);


    setTimeout(() => {

        ripple.remove();

    }, 600);

}


/* =====================================================
   DISABLE CONTEXT MENU
===================================================== */

document.addEventListener(
    "contextmenu",
    function(e) {

        e.preventDefault();

    }
);

</script>
