<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<meta name="theme-color" content="#050505">

<title>VaiperX IOS Installation Center</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    min-height:100%;
    background:#050505;
}

body{

    width:100%;
    min-height:100vh;

    background:#050505;

    color:white;

    font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

    overflow-x:hidden;

}


/* =========================================================
   BACKGROUND IMAGE
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background-image:

        linear-gradient(
            rgba(0,0,0,.08),
            rgba(0,0,0,.15)
        ),

        url(
            "https://i.postimg.cc/mksRjQXP/4D545010-7BA7-4BAE-A2BB-8DA73DE38FAB.png"
        );

    background-position:
        center top;

    background-size:
        cover;

    background-repeat:
        no-repeat;

    z-index:-10;

}


/* =========================================================
   DARK OVERLAY
========================================================= */

body::after{

    content:"";

    position:fixed;

    inset:0;

    background:

        radial-gradient(
            circle at 50% 20%,
            transparent 0%,
            rgba(0,0,0,.08) 45%,
            rgba(0,0,0,.38) 100%
        );

    pointer-events:none;

    z-index:-9;

}


/* =========================================================
   RED GLOW
========================================================= */

.red-glow{

    position:fixed;

    width:320px;
    height:320px;

    border-radius:50%;

    background:#ff0000;

    filter:blur(130px);

    opacity:.10;

    pointer-events:none;

    z-index:-5;

    animation:
        glowMove
        8s ease-in-out infinite alternate;

}


.red-glow.left{

    left:-180px;
    top:40%;

}


.red-glow.right{

    right:-180px;
    bottom:10%;

    animation-delay:2s;

}


@keyframes glowMove{

    from{
        transform:translateY(-30px);
    }

    to{
        transform:translateY(30px);
    }

}


/* =========================================================
   PARTICLES
========================================================= */

.particle{

    position:fixed;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#ff1b1b;

    box-shadow:
        0 0 6px #ff0000,
        0 0 14px #ff0000;

    pointer-events:none;

    z-index:-3;

    animation:
        floatParticle
        linear infinite;

}


.particle:nth-of-type(1){
    left:8%;
    top:80%;
    animation-duration:7s;
}

.particle:nth-of-type(2){
    left:20%;
    top:65%;
    animation-duration:9s;
}

.particle:nth-of-type(3){
    left:32%;
    top:90%;
    animation-duration:6s;
}

.particle:nth-of-type(4){
    left:50%;
    top:75%;
    animation-duration:8s;
}

.particle:nth-of-type(5){
    left:68%;
    top:85%;
    animation-duration:10s;
}

.particle:nth-of-type(6){
    left:82%;
    top:70%;
    animation-duration:7s;
}

.particle:nth-of-type(7){
    left:93%;
    top:50%;
    animation-duration:9s;
}


@keyframes floatParticle{

    0%{
        transform:
            translateY(40px)
            scale(.5);

        opacity:0;
    }

    20%{
        opacity:.8;
    }

    80%{
        opacity:.8;
    }

    100%{
        transform:
            translateY(-180px)
            scale(1.3);

        opacity:0;
    }

}


/* =========================================================
   MAIN
========================================================= */

.page{

    width:100%;

    max-width:560px;

    min-height:100vh;

    margin:
        0 auto;

    padding:
        15px
        12px
        28px;

    position:relative;

}


/* =========================================================
   TOP LINE
========================================================= */

.top-line{

    width:80%;

    height:3px;

    margin:
        0 auto 15px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #ff0000,
            #ffffff,
            #ff0000,
            transparent
        );

    box-shadow:

        0 0 7px #ff0000,
        0 0 20px #ff0000;

}


/* =========================================================
   LOGO
========================================================= */

.logo-area{

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    position:relative;

    margin-bottom:3px;

}


.logo-image{

    width:
        min(
            92%,
            500px
        );

    max-height:310px;

    object-fit:contain;

    display:block;

    filter:

        drop-shadow(
            0 0 6px
            rgba(255,0,0,.65)
        )

        drop-shadow(
            0 0 18px
            rgba(255,0,0,.30)
        );

}


/* =========================================================
   CENTER TITLE
========================================================= */

.center-title{

    width:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    margin:
        7px 0 19px;

    font-size:
        clamp(
            9px,
            2.8vw,
            13px
        );

    font-weight:500;

    letter-spacing:
        clamp(
            2px,
            1vw,
            5px
        );

    color:#f5f5f5;

    text-shadow:
        0 0 7px #ff0000;

}


.center-title::before,
.center-title::after{

    content:"";

    height:2px;

    width:38px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #ff1111
        );

    box-shadow:
        0 0 8px #ff0000;

}


.center-title::after{

    background:

        linear-gradient(
            90deg,
            #ff1111,
            transparent
        );

}


/* =========================================================
   MENU
========================================================= */

.menu{

    width:100%;

    display:flex;

    flex-direction:column;

    gap:15px;

}


/* =========================================================
   BUTTON
========================================================= */

.menu-button{

    width:100%;

    min-height:112px;

    position:relative;

    display:flex;

    align-items:center;

    overflow:hidden;

    text-decoration:none;

    color:white;

    border-radius:20px;

    background:

        rgba(5,5,5,.45)

        url(
            "https://i.postimg.cc/90hVbG8R/6CB3A5F7-F5FF-4205-AC8F-C60EF7FAE356.png"
        )

        center / 100% 100%

        no-repeat;

    filter:
        drop-shadow(
            0 0 4px
            rgba(255,0,0,.8)
        );

    transition:
        transform .18s ease,
        filter .18s ease;

}


/* =========================================================
   BUTTON HOVER
========================================================= */

.menu-button:hover{

    transform:
        translateY(-2px);

    filter:

        drop-shadow(
            0 0 5px
            rgba(255,0,0,1)
        )

        drop-shadow(
            0 0 15px
            rgba(255,0,0,.5)
        );

}


.menu-button:active{

    transform:
        scale(.965);

}


/* =========================================================
   BUTTON SHINE
========================================================= */

.menu-button .shine{

    position:absolute;

    width:100px;
    height:180%;

    top:-40%;

    left:-150px;

    transform:
        rotate(20deg);

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.15),
            transparent
        );

    pointer-events:none;

    animation:
        shineMove
        5s linear infinite;

}


@keyframes shineMove{

    0%{
        left:-180px;
    }

    45%{
        left:120%;
    }

    100%{
        left:120%;
    }

}


/* =========================================================
   ICON AREA
========================================================= */

.icon-area{

    width:88px;

    min-width:88px;

    height:88px;

    display:flex;

    align-items:center;

    justify-content:center;

    margin-left:14px;

    margin-right:13px;

    position:relative;

    z-index:2;

}


/* =========================================================
   ICON IMAGE
========================================================= */

.icon-area img{

    width:100%;

    height:100%;

    object-fit:contain;

    display:block;

    filter:

        drop-shadow(
            0 0 5px
            rgba(255,0,0,.7)
        );

}


/* =========================================================
   BUTTON CONTENT
========================================================= */

.button-content{

    flex:1;

    min-width:0;

    position:relative;

    z-index:2;

    padding:
        0 4px;

}


/* =========================================================
   BUTTON TITLE
========================================================= */

.button-title{

    font-size:
        clamp(
            18px,
            5vw,
            26px
        );

    line-height:1.15;

    font-weight:900;

    font-style:italic;

    color:#ffffff;

    text-shadow:

        0 0 5px
        rgba(255,255,255,.35),

        0 0 9px

}


/* =========================================================
   DESCRIPTION
========================================================= */

.button-description{

            14px
        );

    line-height:1.3;

    font-weight:400;

/* =========================================================

========================================================= */

.arrow-area img{

.menu-button:hover

/* =========================================================
   BUTTON 2
========================================================= */

/* =========================================================

/* =========================================================
   BUTTON 4
========================================================= */

/* =========================================================
   BOTTOM SECTION
========================================================= */

.bottom-section{

    width:100%;

    position:relative;

    margin-top:25px;

    display:flex;

    justify-content:center;

}


/* =========================================================
   BOTTOM FRAME
========================================================= */

.bottom-frame{

    width:96%;

    display:block;

    object-fit:contain;

    filter:

        drop-shadow(
            0 0 7px
            rgba(255,0,0,.65)
        );

}


/* =========================================================
   BOTTOM TEXT
========================================================= */

.bottom-text{

    position:absolute;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    width:80%;

    text-align:center;

    font-size:
        clamp(
            14px,
            4vw,
            20px
        );

    line-height:1.25;

    font-weight:800;

    font-style:italic;

    color:#ff1515;

    text-shadow:

        0 0 5px #ff0000,
        0 0 12px #ff0000;

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    margin-top:8px;

    text-align:center;

    font-size:10px;

    letter-spacing:5px;

    color:#cfcfcf;

    text-shadow:
        0 0 6px
        rgba(255,0,0,.6);

}


.footer .red{

    color:#ff1c1c;

}


/* =========================================================
   LIGHTNING
========================================================= */

.lightning{

    position:fixed;

    width:3px;

    height:150px;

    background:#ff1515;

    box-shadow:

        0 0 6px #ff0000,
        0 0 15px #ff0000,
        0 0 35px #ff0000;

    opacity:.35;

    pointer-events:none;

    z-index:-2;

}


.lightning.left{

    left:3%;

    bottom:5%;

    transform:
        rotate(27deg);

}


.lightning.right{

    right:3%;

    bottom:13%;

    transform:
        rotate(-27deg);

}


/* =========================================================
   MOBILE
========================================================= */

<script>

/* =========================================================
   BUTTON TOUCH EFFECT
========================================================= */

const buttons =
    document.querySelectorAll(
        ".menu-button"
    );


buttons.forEach(
    button => {


        button.addEventListener(
            "touchstart",

            () => {

                button.style.transform =
                    "scale(.965)";

            },

            {
                passive:true
            }

        );


        button.addEventListener(
            "touchend",

            () => {

                button.style.transform =
                    "";

            },

            {
                passive:true
            }

        );


        button.addEventListener(
            "touchcancel",

            () => {

                button.style.transform =
                    "";

            },

            {
                passive:true
            }

        );

    }
);


/* =========================================================
   PREVENT DOUBLE TAP ZOOM
========================================================= */

let lastTouchEnd = 0;


document.addEventListener(

    "touchend",

    function(event){

        const now =
            Date.now();


        if(
            now - lastTouchEnd <= 300
        ){

            event.preventDefault();

        }


        lastTouchEnd =
            now;

    },

    {
        passive:false
    }

);


/* =========================================================
   IMAGE ERROR CHECK
========================================================= */

document
.querySelectorAll("img")
.forEach(

    img => {

        img.addEventListener(
            "error",

            function(){

                console.log(
                    "ไม่สามารถโหลดรูป:",
                    this.src
                );

            }

        );

    }

);

</script>
